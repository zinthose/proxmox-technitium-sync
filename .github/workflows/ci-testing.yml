name: CI/CD Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint bandit

      - name: Run pytest (Unit Tests)
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: false

      - name: Run flake8 (PEP8 Style)
        run: |
          flake8 src/ tests/ --max-line-length=100 --count --show-source --statistics
        continue-on-error: false

      - name: Run pylint (Code Quality)
        run: |
          pylint src/ tests/ --disable=C0111,W0212 --exit-zero
        continue-on-error: false

      - name: Run bandit (Security Linting)
        run: |
          bandit -r src/ -ll
        continue-on-error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (dry-run)
        run: |
          docker build -t proxmox-technitium-sync:test .

      - name: Verify Docker image
        run: |
          docker inspect proxmox-technitium-sync:test
